name: TQQQ Daily Alert Bot
on:
  schedule:
    # =========================================================================
    # 🕒 미국 주식 마감 15분 전 (한국 시간 기준) 자동 실행 설정
    # =========================================================================
    # 1. 서머타임 해제 기간 (현재 - 겨울): 새벽 5시 45분 알림
    #    설정값: '45 20 * * 1-5' (UTC 20:45 = KST 05:45)
    #
    # 2. 서머타임 적용 기간 (여름 - 3월 8일부터): 새벽 4시 45분 알림
    #    설정값: '45 19 * * 1-5' (UTC 19:45 = KST 04:45)
    # =========================================================================
    - cron: '15 20 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼 (테스트용)
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 코드 가져오기
      uses: actions/checkout@v3
    - name: 2. 파이썬 설치하기
      uses: actions/setup-python@v4
      with:
        python-version: '3.12' 
    - name: 3. 라이브러리 설치하기
      run: |
        pip install -r requirements.txt
    - name: 4. 알림 봇 실행하기
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python alert_bot.py
